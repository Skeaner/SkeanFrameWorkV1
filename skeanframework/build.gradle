plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id "kotlin-allopen"
    id 'kotlin-parcelize'
    id "kotlin-kapt"
    id 'maven-publish'
}

def koin_version = "3.5.6"
def compose_bom_version = "2023.01.00" // 使用 BOM 管理版本

android {
    namespace 'me.skean.skeanframework'

    compileSdk 34

    defaultConfig {
        minSdk 24
        kapt {
            arguments {
                arg('eventBusIndex', 'me.skean.skeanframework.EventBusIndex')
                arg('androidManifestFile', "$projectDir/src/main/AndroidManifest.xml")
            }
        }
    }

    buildFeatures {
        viewBinding true
        dataBinding true
        buildConfig true
        compose true
    }

    composeOptions {
        // Kotlin 1.8.10 对应 1.4.2
        // 如果你使用的是 Kotlin 1.8.20，请改为 1.4.7
        kotlinCompilerExtensionVersion "1.4.7"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = "11"
        freeCompilerArgs += ["-Xjvm-default=all-compatibility"]

    }


    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }


    publishing {
        singleVariant('release') {
            // 如果你想把源码和 JavaDoc 也打包进去，可以加上：
            withSourcesJar()
            withJavadocJar()
        }
    }

}

publishing {
    publications {
        // 在 Groovy 中通常使用 create 或 register
        release(MavenPublication) {
            groupId = 'com.github.Skeaner'
            artifactId = 'SkeanFrameWork'
            version = '2.0.0'

            // AGP 7.x 建议在 afterEvaluate 或使用特定的从属关系
            afterEvaluate {
                from components.release
            }
        }
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
    maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
}


dependencies {
    api fileTree(dir: 'libs', include: ['*.jar'])
    api "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    // EventBus
    api 'org.greenrobot:eventbus:3.1.1'
    kapt 'org.greenrobot:eventbus-annotation-processor:3.1.1'
    api fileTree(include: ['*.jar'], dir: 'libs')
    //谷歌库
    api 'androidx.core:core-ktx:1.9.0'
    api 'androidx.appcompat:appcompat:1.6.1'
    api 'androidx.multidex:multidex:2.0.1'
    api 'androidx.recyclerview:recyclerview:1.3.0'
    api 'com.google.android.material:material:1.8.0'
    api "androidx.navigation:navigation-fragment-ktx:2.5.3"
    api "androidx.navigation:navigation-ui-ktx:2.5.3"
    api "androidx.navigation:navigation-compose:2.5.3"
    // --- Compose 核心依赖 (使用 BOM 简化版本管理) ---
    def composeBom = platform("androidx.compose:compose-bom:$compose_bom_version")
    api composeBom
    api 'androidx.compose.ui:ui'
    api 'androidx.compose.ui:ui-tooling-preview'
    api 'androidx.compose.material:material' // 或者使用 material3
    api 'androidx.compose.runtime:runtime-livedata' // 如果需要配合 LiveData
    debugApi 'androidx.compose.ui:ui-tooling'
    // 集成 Compose 到现有的 Activity/Lifecycle
    api 'androidx.activity:activity-compose:1.6.1'
    api 'androidx.lifecycle:lifecycle-viewmodel-compose:2.5.1'
    //Room
    api "androidx.room:room-runtime:2.5.0"
    api "androidx.room:room-rxjava2:2.5.0"
    api "androidx.room:room-ktx:2.5.0"
    kapt "androidx.room:room-compiler:2.5.0"
    api "androidx.sqlite:sqlite-ktx:2.2.0"
    //retrofit2
    api 'com.squareup.retrofit2:retrofit:2.9.0'
    api 'com.squareup.retrofit2:converter-jackson:2.9.0'
    api 'com.squareup.retrofit2:adapter-rxjava2:2.9.0'
    api 'com.squareup.okhttp3:logging-interceptor:4.10.0'
    api 'com.github.franmontiel:PersistentCookieJar:v1.0.1'
    //RxJava的库
    api 'io.reactivex.rxjava2:rxandroid:2.1.1'
    api 'io.reactivex.rxjava2:rxjava:2.2.21'
    api 'com.jakewharton.rxbinding2:rxbinding:2.2.0'
    api 'com.jakewharton.rxbinding2:rxbinding-support-v4:2.2.0'
    api 'com.jakewharton.rxbinding2:rxbinding-appcompat-v7:2.2.0'
    api 'com.jakewharton.rxbinding2:rxbinding-design:2.2.0'
    api 'com.jakewharton.rxbinding2:rxbinding-recyclerview-v7:2.2.0'
    api 'com.trello.rxlifecycle3:rxlifecycle:3.1.0'
    api 'com.trello.rxlifecycle3:rxlifecycle-android:3.1.0'
    api 'com.trello.rxlifecycle3:rxlifecycle-components:3.1.0'
    api 'com.trello.rxlifecycle3:rxlifecycle-android-lifecycle:3.1.0'
    api 'com.trello.rxlifecycle3:rxlifecycle-kotlin:3.1.0'
    api 'com.trello.rxlifecycle3:rxlifecycle-android-lifecycle-kotlin:3.1.0'
    //高德地图
    // api 'com.amap.api:3dmap:9.2.0'
    api 'com.amap.api:map2d:6.0.0'
    api 'com.amap.api:location:6.1.0'
    // sql-cipher支持
    api 'net.zetetic:android-database-sqlcipher:4.4.0@aar'
    //json解析器
    api 'com.fasterxml.jackson.core:jackson-core:2.11.0'
    api 'com.fasterxml.jackson.core:jackson-databind:2.11.0'
    api 'com.fasterxml.jackson.core:jackson-annotations:2.11.0'
    api "com.fasterxml.jackson.module:jackson-module-kotlin:2.11.0"
    //Apache的常用库
    api 'commons-codec:commons-codec:1.11'
    api 'commons-net:commons-net:3.5'
    api 'org.apache.commons:commons-collections4:4.2'
    api 'org.apache.commons:commons-lang3:3.9'
    //软引用的handler
    api 'com.badoo.mobile:android-weak-handler:1.1'
    //图片加载Glide
    api 'com.github.bumptech.glide:glide:4.15.1'
    kapt 'com.github.bumptech.glide:compiler:4.15.1'
    //图片显示PhotoView
    api 'com.github.chrisbanes:PhotoView:2.3.0'
    //图片触摸库
    api 'it.sephiroth.android.library.imagezoom:imagezoom:2.3.0'
    //图片显示subsamplingImageView
    api 'com.davemorrissey.labs:subsampling-scale-image-view:3.10.0'
    //图片选择器matisse
    api('com.github.Skeaner:Matisse:0.5.3-beta3-extend-1.5') {
        exclude module: "library"
    }
    //ViewPager指示器viewpagerindicator
    api "fr.avianey.com.viewpagerindicator:library:2.4.1.1@aar"
    //综合工具库utilcode
    api 'com.blankj:utilcodex:1.31.1'
    //下拉刷新ultra-ptr
    api 'in.srain.cube:ultra-ptr:1.0.11'
    //RecyclerView综合适配器
    api "io.github.cymchad:BaseRecyclerViewAdapterHelper:3.0.11"
    //material design日期加时间选择器
    api 'com.github.Skeaner:SublimePicker:2.1.2-androidx'
    //权限与提示
    api 'com.github.Skeaner:EasyPermissionDialog:2.1-xxpermissions'
    //bugly
    api "com.tencent.bugly:crashreport:4.1.9.3"
    //数字进度条
    api 'com.daimajia.numberprogressbar:library:1.4@aar'
    //kotpref
    api 'com.chibatching.kotpref:kotpref:2.13.2'
    api 'com.chibatching.kotpref:preference-screen-dsl:2.13.2'

    //旧款 MaterialDialog
    api 'com.github.Skeaner.OldMaterialDialogs:core:1.0.0'
    api 'com.github.Skeaner.OldMaterialDialogs:commons:1.0.0'
    //MaterialDialog
    api 'com.afollestad.material-dialogs:core:3.3.0'
    api 'com.afollestad.material-dialogs:input:3.3.0'
    api 'com.afollestad.material-dialogs:bottomsheets:3.3.0'
    //刷新库
    api 'io.github.scwang90:refresh-layout-kernel:2.0.5'
    api 'io.github.scwang90:refresh-header-classics:2.0.5'    //经典刷新头
    api 'io.github.scwang90:refresh-footer-classics:2.0.5'
    //koin
    api "io.insert-koin:koin-android:$koin_version"// Koin main features for Android
    api "io.insert-koin:koin-android-compat:$koin_version"// Java Compatibility
    api "io.insert-koin:koin-androidx-workmanager:$koin_version"// Jetpack WorkManager
    api "io.insert-koin:koin-androidx-navigation:$koin_version"// Navigation Graph
    api "io.insert-koin:koin-androidx-compose:$koin_version"// Jetpack Compose
    //viewBinding
    api 'com.hi-dhl:binding:1.2.0'
}
